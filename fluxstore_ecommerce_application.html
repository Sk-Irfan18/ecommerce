<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FluxStore | Premium eCommerce Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .hide { display: none !important; }
        .toast { animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .transition-all { transition-property: all; transition-duration: 300ms; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 transition-colors duration-300">

    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <nav class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="text-2xl font-extrabold text-indigo-600 cursor-pointer flex items-center gap-2" onclick="showView('home')">
                <i class="fas fa-bolt"></i> FluxStore
            </div>
            <div class="hidden md:flex flex-1 mx-8 max-w-lg">
                <div class="relative w-full">
                    <input type="text" id="searchInput" placeholder="Search 500+ products..." 
                        class="w-full pl-10 pr-4 py-2 bg-slate-100 border-transparent border focus:bg-white focus:border-indigo-500 rounded-full focus:outline-none transition-all">
                    <i class="fas fa-search absolute left-3.5 top-3 text-slate-400"></i>
                </div>
            </div>
            <div class="flex items-center space-x-6">
                <button onclick="toggleDarkMode()" class="text-slate-600 hover:text-indigo-600"><i class="fas fa-moon"></i></button>
                <button onclick="openCart()" class="relative text-slate-600 hover:text-indigo-600">
                    <i class="fas fa-shopping-bag text-xl"></i>
                    <span id="cartCount" class="absolute -top-2 -right-2 bg-indigo-600 text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center">0</span>
                </button>
            </div>
        </nav>
    </header>

    <main id="app" class="max-w-7xl mx-auto px-4 py-8">
        
        <div id="view-home">
            <div class="relative bg-slate-900 rounded-3xl p-12 text-white overflow-hidden mb-12 shadow-2xl">
                <div class="relative z-10 max-w-lg">
                    <h1 class="text-5xl font-extrabold mb-4 leading-tight">Future of Premium Shopping</h1>
                    <p class="text-lg text-slate-300 mb-8">Discover our curated selection of 500+ high-end technology and lifestyle essentials.</p>
                    <button onclick="showView('products')" class="bg-indigo-500 hover:bg-indigo-400 px-8 py-3 rounded-full font-bold transition-all shadow-lg shadow-indigo-500/20">Explore 500+ Products</button>
                </div>
            </div>

            <h2 class="text-2xl font-bold mb-8">Popular Categories</h2>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12">
                <div class="group p-6 bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl transition-all cursor-pointer text-center" onclick="filterCategory('Electronics')">
                    <div class="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform"><i class="fas fa-laptop text-2xl text-indigo-600"></i></div>
                    <p class="font-semibold">Electronics</p>
                </div>
                <div class="group p-6 bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl transition-all cursor-pointer text-center" onclick="filterCategory('Fashion')">
                    <div class="w-16 h-16 bg-pink-50 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform"><i class="fas fa-tshirt text-2xl text-pink-600"></i></div>
                    <p class="font-semibold">Fashion</p>
                </div>
                <div class="group p-6 bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl transition-all cursor-pointer text-center" onclick="filterCategory('Home')">
                    <div class="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform"><i class="fas fa-couch text-2xl text-emerald-600"></i></div>
                    <p class="font-semibold">Home Living</p>
                </div>
                <div class="group p-6 bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-xl transition-all cursor-pointer text-center" onclick="filterCategory('Beauty')">
                    <div class="w-16 h-16 bg-purple-50 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform"><i class="fas fa-sparkles text-2xl text-purple-600"></i></div>
                    <p class="font-semibold">Beauty</p>
                </div>
            </div>
        </div>

        <div id="view-products" class="hide">
            <h2 id="categoryTitle" class="text-3xl font-bold mb-8 capitalize">Our Products</h2>
            <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
        </div>

        <div id="view-checkout" class="hide max-w-3xl mx-auto">
            <h2 class="text-3xl font-bold mb-8">Complete Checkout</h2>
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                <form id="checkoutForm" onsubmit="processCheckout(event)">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="mb-4"><label class="block text-sm font-medium mb-1">Full Name</label><input type="text" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                        <div class="mb-4"><label class="block text-sm font-medium mb-1">Email Address</label><input type="email" required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"></div>
                    </div>
                    <div class="mb-4"><label class="block text-sm font-medium mb-1">Shipping Address</label><textarea required class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"></textarea></div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium mb-1">Payment Method</label>
                        <select class="w-full p-3 border rounded-xl"><option>Credit Card</option><option>PayPal</option><option>Apple Pay</option></select>
                    </div>
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition-all text-lg shadow-lg">Confirm Order</button>
                </form>
            </div>
        </div>
    </main>

    <div id="cartDrawer" class="fixed top-0 right-0 h-full w-full max-w-sm bg-white shadow-2xl p-6 hide z-[60] flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Your Bag</h2>
            <button onclick="closeCart()" class="text-2xl hover:text-indigo-600">&times;</button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto space-y-4 pr-2"></div>
        <div id="cartSummary" class="mt-6 border-t pt-4"></div>
    </div>

    <div id="productModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center hide z-[70] p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full p-8 relative animate-in fade-in zoom-in duration-300">
            <button onclick="closeModal()" class="absolute top-6 right-6 text-2xl hover:text-red-500">&times;</button>
            <div id="modalContent" class="grid md:grid-cols-2 gap-8 items-center"></div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-5 right-5 z-50"></div>

    <script>
        // Generate 500+ products dynamically
        const categories = ['Electronics', 'Fashion', 'Home', 'Beauty'];
        const products = [];
        
        for (let i = 1; i <= 512; i++) {
            const category = categories[i % categories.length];
            const color = ['4f46e5', '10b981', 'ec4899', 'f59e0b', '3b82f6', '8b5cf6'][i % 6];
            products.push({
                id: i,
                name: `${category} Premium ${i}`,
                price: parseFloat((Math.random() * 500 + 15).toFixed(2)),
                category: category,
                rating: (Math.random() * (5.0 - 4.0) + 4.0).toFixed(1),
                image: `https://placehold.co/400x400/${color}/white?text=${category}+${i}`
            });
        }

        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];

        function renderProducts(filter = '', category = '') {
            const grid = document.getElementById('productGrid');
            const filtered = products.filter(p => 
                (filter === '' || p.name.toLowerCase().includes(filter.toLowerCase())) && 
                (category === '' || p.category === category)
            );
            
            grid.innerHTML = filtered.length > 0 ? filtered.map(p => `
                <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:shadow-2xl transition-all group overflow-hidden">
                    <div class="relative overflow-hidden rounded-xl mb-4 h-56 bg-slate-100">
                        <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <button onclick="toggleWishlist(${p.id})" class="absolute top-3 right-3 bg-white/80 backdrop-blur p-2 rounded-full hover:text-red-500">
                            <i class="${wishlist.includes(p.id) ? 'fas' : 'far'} fa-heart"></i>
                        </button>
                    </div>
                    <h3 class="font-bold text-lg leading-tight mb-1">${p.name}</h3>
                    <div class="flex items-center mb-3 text-sm text-slate-500"><i class="fas fa-star text-yellow-400 mr-1"></i> ${p.rating}</div>
                    <div class="flex justify-between items-center">
                        <span class="text-xl font-extrabold text-indigo-600">$${p.price.toFixed(2)}</span>
                        <button onclick="openModal(${p.id})" class="bg-slate-900 text-white px-5 py-2.5 rounded-lg hover:bg-indigo-600 transition-all font-semibold">Details</button>
                    </div>
                </div>
            `).join('') : '<p class="text-center col-span-full py-20 text-slate-400">No products found.</p>';
        }

        function openModal(id) {
            const product = products.find(p => p.id === id);
            const modal = document.getElementById('productModal');
            document.getElementById('modalContent').innerHTML = `
                <img src="${product.image}" class="w-full h-64 md:h-full object-cover rounded-2xl">
                <div>
                    <h2 class="text-3xl font-bold mb-2">${product.name}</h2>
                    <p class="text-3xl font-extrabold text-indigo-600 mb-4">$${product.price}</p>
                    <p class="text-slate-600 mb-6 leading-relaxed">This is a ${product.category} item designed with premium materials. Experience excellence in every detail.</p>
                    <button onclick="addToCart(${product.id}); closeModal()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-lg hover:bg-indigo-700">Add to Bag</button>
                </div>
            `;
            modal.classList.remove('hide');
        }

        function closeModal() { document.getElementById('productModal').classList.add('hide'); }

        function showView(view) {
            document.querySelectorAll('#app > div').forEach(v => v.classList.add('hide'));
            document.getElementById(`view-${view}`).classList.remove('hide');
            if(view === 'products') renderProducts();
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push(product);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartUI();
            showToast(`Added ${product.name} to cart!`);
        }

        function toggleWishlist(id) {
            if(wishlist.includes(id)) wishlist = wishlist.filter(i => i !== id);
            else wishlist.push(id);
            localStorage.setItem('wishlist', JSON.stringify(wishlist));
            renderProducts();
        }

        function openCart() { document.getElementById('cartDrawer').classList.remove('hide'); renderCart(); }
        function closeCart() { document.getElementById('cartDrawer').classList.add('hide'); }

        function renderCart() {
            const container = document.getElementById('cartItems');
            container.innerHTML = cart.length === 0 ? '<p class="text-center mt-20 text-slate-400">Your bag is empty.</p>' : cart.map((item, index) => `
                <div class="flex items-center gap-4 bg-slate-50 p-3 rounded-xl border">
                    <img src="${item.image}" class="w-16 h-16 rounded object-cover">
                    <div class="flex-1">
                        <h4 class="font-bold text-sm truncate">${item.name}</h4>
                        <p class="text-indigo-600 font-bold">$${item.price.toFixed(2)}</p>
                    </div>
                    <button onclick="removeFromCart(${index})" class="text-slate-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            document.getElementById('cartSummary').innerHTML = cart.length > 0 ? `
                <div class="flex justify-between font-bold text-lg mb-4"><span>Total</span><span>$${total.toFixed(2)}</span></div>
                <button onclick="closeCart(); showView('checkout')" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold hover:bg-indigo-700 transition-all">Proceed to Checkout</button>
            ` : '';
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            updateCartUI();
        }

        function updateCartUI() { document.getElementById('cartCount').innerText = cart.length; }

        function processCheckout(e) {
            e.preventDefault();
            cart = [];
            localStorage.setItem('cart', '[]');
            updateCartUI();
            showToast("Order placed successfully!");
            setTimeout(() => showView('home'), 2000);
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.className = 'toast bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-lg mb-2';
            t.innerText = msg;
            document.getElementById('toastContainer').appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function toggleDarkMode() { document.body.classList.toggle('bg-slate-950'); document.body.classList.toggle('text-white'); }
        function filterCategory(cat) { showView('products'); renderProducts('', cat); document.getElementById('categoryTitle').innerText = cat; }

        document.getElementById('searchInput').addEventListener('input', (e) => { showView('products'); renderProducts(e.target.value); });
        
        // Initialize App
        updateCartUI();
    </script>
</body>
</html>
